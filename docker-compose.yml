version: '3.8'

services:
  oracle:
    image: gvenzl/oracle-xe:18.4.0-slim
    container_name: oracle-xe
    restart: unless-stopped
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      - ORACLE_PASSWORD=Gusano15.
      - ORACLE_CHARACTERSET=AL32UTF8
      - ORACLE_ALLOW_REMOTE=true
    volumes:
      # Monta el archivo DDL.sql directamente dentro de la carpeta de inicialización
      - ./DDL.sql:/docker-entrypoint-initdb.d/DDL.sql:ro
      # Crea un volumen persistente para los datos
      - oracle-data:/opt/oracle/oradata

volumes:
  oracle-data:
