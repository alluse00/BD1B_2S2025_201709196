services:
  oracle:
    image: gvenzl/oracle-xe:18.4.0-slim
    container_name: oracle-xe
    restart: unless-stopped
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      - ORACLE_PASSWORD=Gusano15.
      - ORACLE_CHARACTERSET=AL32UTF8
      - ORACLE_ALLOW_REMOTE=true
    volumes:
      # Monta el script DDL.sql en la carpeta de inicialización automática
      # La imagen gvenzl/oracle-xe ejecuta automáticamente los scripts en /container-entrypoint-initdb.d/
      - ./DDL.sql:/container-entrypoint-initdb.d/01_DDL.sql:ro
      # Crea un volumen persistente para los datos
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  oracle-data:
